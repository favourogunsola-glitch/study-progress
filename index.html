<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Study Progress Dashboard</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body { background-color: #f4f7ff; font-family: Arial, sans-serif; }
    .jumbotron { background-color: #e8edff; border-left: 6px solid #FF5A43; }
    .jumbotron h1 { color: #FF5A43; }
    .section-title { color: #FF5A43; margin-top: 30px; margin-bottom: 15px; }
    p { font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>

  
  <div class="jumbotron jumbotron-fluid">
    <div class="container">
      <h1>Study Goals Tracking bar</h1>
      <p class="lead">Track all subjects read, lessons done and progress made.</p>

      <!-- TOPIC 2: BUTTONS -->
      <button class="btn btn-primary">Math</button>
      <button class="btn btn-success">Chemistry</button>
      <button class="btn btn-warning">English</button>
      <button class="btn btn-danger">Digital Teachnology</button>
    </div>
  </div>

  <div class="container">

    
    <h2 class="section-title">Classes completed<span class="badge badge-danger">28</span></h2>

    <p>Math <span class="badge badge-primary">15 lessons</span></p>
    <p>Chemistry<span class="badge badge-success">8 lessons</span></p>
    <p>English <span class="badge badge-warning">3 lessons</span></p>
    <p>Digital Technology<span class="badge badge-info">2 lessons</span></p>

    
    <h2 class="section-title">Reading progress</h2>

    <p>Math</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-primary" style="width: 74%">74%</div>
    </div>

    <p>Chemistry</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-success" style="width: 38%">38%</div>
    </div>

    <p>English</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-warning" style="width: 90%">90</div>
    </div>

    <p>Digital Technology</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-danger" style="width: 76%">76%</div>
    </div>

  </div>

  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
